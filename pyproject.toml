[project]
name = "oryn-harness"
version = "0.1.0"
description = "Long-running autonomous coding harness wrapping Claude Code CLI"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "playwright>=1.40",
]

[project.scripts]
oryn = "oryn_harness.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["oryn_harness*"]
